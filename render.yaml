services:
  - type: web
    name: krushiraksha-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: https://aryan1238.github.io,https://krushiraksha.vercel.app,http://localhost:5173,http://127.0.0.1:5173
